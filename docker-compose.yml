services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: arkano-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 20"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: arkano-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      cub kafka-ready -b kafka:9092 1 30 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic client.created --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic account.created --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic balance.updated --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction.requested --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction.completed --partitions 1 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic transaction.rejected --partitions 1 --replication-factor 1
      "

  accounts-db:
    image: postgres:16-alpine
    container_name: arkano-accounts-db
    environment:
      POSTGRES_DB: accounts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d accounts"]
      interval: 10s
      timeout: 5s
      retries: 10

  transactions-db:
    image: postgres:16-alpine
    container_name: arkano-transactions-db
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d transactions"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-db:
    image: postgres:16-alpine
    container_name: arkano-ai-db
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai"]
      interval: 10s
      timeout: 5s
      retries: 10

  accounts-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkano-accounts-service
    command: ["node", "dist/apps/accounts-service/src/main.js"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      accounts-db:
        condition: service_healthy
    environment:
      APP_NAME: accounts-service
      PORT: 3001
      DB_HOST: accounts-db
      DB_PORT: 5432
      DB_NAME: accounts
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: accounts-service
      KAFKA_GROUP_ID: accounts-service-group
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  transactions-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkano-transactions-service
    command: ["node", "dist/apps/transactions-service/src/main.js"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      transactions-db:
        condition: service_healthy
    environment:
      APP_NAME: transactions-service
      PORT: 3002
      DB_HOST: transactions-db
      DB_PORT: 5432
      DB_NAME: transactions
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: transactions-service
      KAFKA_GROUP_ID: transactions-service-group
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arkano-ai-service
    command: ["node", "dist/apps/ai-service/src/main.js"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ai-db:
        condition: service_healthy
    environment:
      APP_NAME: ai-service
      PORT: 3003
      DB_HOST: ai-db
      DB_PORT: 5432
      DB_NAME: ai
      DB_USER: postgres
      DB_PASSWORD: postgres
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: ai-service
      KAFKA_GROUP_ID: ai-service-group
      LLM_PROVIDER: mock
      KAFKAJS_NO_PARTITIONER_WARNING: "1"
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
